<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AgriPOS — Field Operator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  @keyframes blink { 0%,50% { opacity: 0.5 } 51%,100% { opacity: 0 } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="screens/login.jsx"></script>
<script type="text/babel" src="screens/search.jsx"></script>
<script type="text/babel" src="screens/products.jsx"></script>
<script type="text/babel" src="screens/checkout.jsx"></script>
<script type="text/babel" src="screens/debt.jsx"></script>
<script type="text/babel" src="screens/repayment.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "earthy",
  "dark": false
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const t = getTheme(tw.theme, tw.dark);
  const dark = tw.dark;

  // Sync canvas bg with theme so the gutter doesn't fight the screens.
  React.useEffect(() => {
    const dc = document.querySelector('.design-canvas');
    if (dc) dc.style.background = dark ? '#1a1612' : '#efe9dc';
  }, [tw.theme, tw.dark]);

  const screens = [
    { id: 'login', label: '01 · Login', node: <LoginScreen t={t} dark={dark} /> },
    { id: 'search', label: '02 · Farmer search', node: <FarmerSearchScreen t={t} dark={dark} /> },
    { id: 'products', label: '03 · Product browser', node: <ProductBrowserScreen t={t} dark={dark} /> },
    { id: 'checkout', label: '04 · Checkout', node: <CheckoutScreen t={t} dark={dark} /> },
    { id: 'debt', label: '05 · Debt summary', node: <DebtSummaryScreen t={t} dark={dark} /> },
    { id: 'repayment', label: '06 · Record repayment', node: <RepaymentScreen t={t} dark={dark} /> },
  ];

  return (
    <>
      <DesignCanvas>
        <DCSection id="flow" title="AgriPOS — Field Operator"
          subtitle="Mobile POS for an agricultural marketplace · Côte d'Ivoire · 6 core screens">
          {screens.map(s => (
            <DCArtboard key={s.id} id={s.id} label={s.label} width={412} height={892}>
              <div data-screen-label={s.label}>{s.node}</div>
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="AgriPOS Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio
          label="Color theme"
          value={tw.theme}
          onChange={(v) => setTweak('theme', v)}
          options={['earthy', 'forest', 'clean']}
        />
        <TweakToggle
          label="Dark mode"
          value={tw.dark}
          onChange={(v) => setTweak('dark', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
